# Custom aspect type templates (design §5.11).
#
# Vendored copy of kc-control-plane `src/cdmc_common/aspect_types/` (the one YAML source of
# §5.11, which every writer validates its payload against). Keep the two in step: a change here
# without the same change there makes the evaluator write payloads the template refuses.
#
# Rendering (tiers/<tier>/main.aspect_types.tf):
#   - `fields` are the type-specific fields, each with its fixed `index`.
#   - The three shared fields of §5.11.1 (`evaluation`, `narrative`, `schema_version`) are
#     appended at `shared_index`, `shared_index + 1`, `shared_index + 2`.
#   - `trailing_fields` follow the shared fields (only `schema_fingerprint`, index 11, on
#     `cdmc-classification`).
# Indexes never change once applied; a field is retired with `deprecated` and a new index
# (reference architecture §4.4). Enum values are appended, never renumbered.

shared_fields:
  evaluation:
    type: record
    required: true
    display_name: Evaluation
    description: The authoritative evaluation record written by the writer path (D-01).
    fields:
      - name: evaluator_version
        index: 1
        type: string
        required: true
        display_name: Evaluator version
        description: Module name and version, for example c12-rollup@1.3.0.
      - name: evaluated_at
        index: 2
        type: datetime
        required: true
        display_name: Evaluated at
        description: When the writer computed the values.
      - name: source_ref
        index: 3
        type: string
        required: true
        display_name: Source reference
        description: Resource name of the evidence the values were computed from.
  narrative:
    type: record
    required: false
    display_name: Narrative
    description: Advisory record. Reserved; no component writes it in this version (P5-2).
    fields:
      - name: summary
        index: 1
        type: string
        display_name: Summary
        description: Generated explanation of the evaluation. Advisory only.
      - name: model
        index: 2
        type: string
        display_name: Model
        description: Model that produced the summary.
      - name: prompt_version
        index: 3
        type: string
        display_name: Prompt version
        description: Version of the prompt that produced the summary.
      - name: authoritative
        index: 4
        type: bool
        display_name: Authoritative
        description: Always false. A narrative is never the basis of a control result.
  schema_version:
    type: int
    required: true
    display_name: Schema version
    description: Version of the template the payload was written against. Starts at 1.

aspect_types:
  cdmc-classification:
    display_name: CDMC classification
    description: Classification level of a BigQuery table or column, with its provenance (C6). Writer is the classifier.
    shared_index: 8
    fields:
      - name: classification_level
        index: 1
        type: enum
        required: true
        values: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
        display_name: Classification level
        description: The level on the D-07 scale.
      - name: is_sensitive
        index: 2
        type: bool
        required: true
        display_name: Is sensitive
        description: True when the level is CONFIDENTIAL or RESTRICTED. Computed from the level.
      - name: source
        index: 3
        type: enum
        required: true
        values: [PENDING_PROFILE, SDP_PROFILE, INFOTYPE_RULE, STEWARD_RAISE, STEWARD_OVERRIDE]
        display_name: Source
        description: Where the level came from. On the table aspect, the source of the level that won.
      - name: rule_version
        index: 4
        type: int
        required: true
        display_name: Rule version
        description: Version of the infoType rule table loaded when the level was computed.
      - name: set_at
        index: 5
        type: datetime
        required: true
        display_name: Set at
        description: When the level was set.
      - name: set_by
        index: 6
        type: string
        required: true
        display_name: Set by
        description: Classifier module version, or the steward's email address for a raise or override.
      - name: override_expires_at
        index: 7
        type: datetime
        required: false
        display_name: Override expires at
        description: Approved expiry of a steward override. Present only when source is STEWARD_OVERRIDE.
    trailing_fields:
      - name: schema_fingerprint
        index: 11
        type: string
        required: false
        display_name: Schema fingerprint
        description: Lower-case hexadecimal SHA-256 of the table's column paths and types. Table-level aspect only.

  cdmc-provisioning-point:
    display_name: CDMC provisioning point
    description: Whether a BigQuery table is a provisioning point (C3). Writer is the C3 module of the control evaluator.
    shared_index: 2
    fields:
      - name: is_provisioning_point
        index: 1
        type: bool
        required: true
        display_name: Is provisioning point
        description: True when the table is an asset of a data product and sits in the analytics subdomain.

  cdmc-lineage-evidence:
    display_name: CDMC lineage evidence
    description: Run-time and design-time ultimate sources of a BigQuery table (C14). Writer is the C14 module of the control evaluator.
    shared_index: 4
    fields:
      - name: run_time_ultimate_source
        index: 1
        type: array
        item_name: source_fqn
        item_type: string
        required: false
        display_name: Run-time ultimate sources
        description: Origins resolved from run-time lineage, as Data Lineage fully qualified names.
      - name: design_time_ultimate_source
        index: 2
        type: array
        item_name: source_fqn
        item_type: string
        required: false
        display_name: Design-time ultimate sources
        description: Origins declared in the domain's lineage manifest, in the same form.
      - name: upstream_data_products
        index: 3
        type: array
        item_name: data_product
        item_type: string
        required: false
        display_name: Upstream data products
        description: Resource names of the data products crossed on the way to the ultimate sources (C3 evidence).

  cdmc-data-product-contract:
    display_name: CDMC data product contract
    description: Owner inputs of a data product contract. Writer is the contract writer of the control evaluator.
    shared_index: 3
    fields:
      - name: aggregate_dq_threshold
        index: 1
        type: double
        required: false
        display_name: Aggregate DQ threshold
        description: Product quality threshold, a percentage from 0 to 100.
      - name: steward
        index: 2
        type: string
        required: false
        display_name: Steward
        description: Email address of the product's steward Google group.

  cdmc-data-product-quality:
    display_name: CDMC data product quality
    description: Pooled quality score, status and freshness of a data product (C12). Writer is the C12 module of the control evaluator.
    shared_index: 4
    fields:
      - name: aggregate_dq_score
        index: 1
        type: double
        required: false
        display_name: Aggregate DQ score
        description: Pooled rule pass rate across the product's scanned tables, 0 to 100. Absent when NOT_EVALUATED.
      - name: aggregate_dq_status
        index: 2
        type: enum
        required: true
        values: [COMPLIANT, NON_COMPLIANT, NOT_EVALUATED]
        display_name: Aggregate DQ status
        description: Product quality status against the contract threshold.
      - name: freshness_status
        index: 3
        type: enum
        required: false
        values: [ON_TIME, LATE]
        display_name: Freshness status
        description: Whether the product met its refresh-cadence commitment. Absent without refresh-cadence.
